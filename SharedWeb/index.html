<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>DrawPad</title>
  <style>
    html, body, #app {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    #app { position: fixed; inset: 0; }
    .excalidraw .App-menu, .excalidraw .App-toolbar { touch-action: manipulation; }
    /* 工具栏（选择/矩形/画笔…）移到右侧竖排垂直居中，避开顶部自定义工具条 */
    .excalidraw .App-menu.App-menu_top {
      height: 100% !important;
      box-sizing: border-box;
    }
    .excalidraw .App-menu.App-menu_top .App-menu_top__left {
      grid-column: 3 !important;
      justify-self: end !important;
      align-self: center !important;
    }
    /* 移除主菜单"Excalidraw links"外链分组（GitHub/X/Discord）及其分隔线 */
    .excalidraw .dropdown-menu-group:has(a[href*="github.com"]),
    .excalidraw .dropdown-menu-group:has(a[href*="x.com"]),
    .excalidraw .dropdown-menu-group:has(a[href*="discord.gg"]) {
      display: none !important;
    }
    .excalidraw .dropdown-menu-separator:has(
        + .dropdown-menu-group:has(a[href*="github.com"])
      ) {
      display: none !important;
    }
  </style>
  <link rel="stylesheet" href="vendor/excalidraw.production.min.css" />
  <script src="vendor/excalidraw.production.min.js" onerror="console.error('script load FAILED: excalidraw')"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    (function () {
      "use strict";
      // console 上报（React 内部错误走 console.error，不会触发 window.onerror）
      function post(name, data) {
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers[name]) {
          window.webkit.messageHandlers[name].postMessage(data);
        }
      }
      ["error", "warn"].forEach(function (level) {
        var original = console[level] ? console[level].bind(console) : function () {};
        console[level] = function () {
          try {
            post("bridgeError", "[" + level + "] " + Array.prototype.map.call(arguments, String).join(" "));
          } catch (e) {}
          original.apply(null, arguments);
        };
      });
      window.onerror = function (msg, src, line, col) {
        post("bridgeError", "onerror: " + msg + " @ " + (src || "?") + ":" + line + ":" + col);
      };
      window.addEventListener("unhandledrejection", function (e) {
        post("bridgeError", "rejection: " + e.reason);
      });
    })();
  </script>
  <script>
    (function () {
      "use strict";
      var excal = null;
      var lastRemoteJSON = null;
      var suppressUntil = 0;
      var sceneVersion = 0;
      // 视口同步状态
      var viewportSuppressUntil = 0;
      var lastSentViewport = null; // { sx, sy, z }

      function post(name, data) {
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers[name]) {
          window.webkit.messageHandlers[name].postMessage(data);
        }
      }

      var props = {
        langCode: "zh-CN",
        theme: "light",
        renderWelcomeScreen: false,
        initialData: {
          appState: {
            viewBackgroundColor: "#ffffff",
            currentItemFontSize: 20
          }
        },
        onExcalidrawAPI: function (api) {
          excal = api;
          window.__excal = api; // 调试暴露
          post("ready", { version: sceneVersion });
        },
        onChange: function (elements, appState) {
          var now = Date.now();
          // --- 元素通道（本端绘制）---
          if (now >= suppressUntil) {
            var json = JSON.stringify(elements);
            if (json !== lastRemoteJSON && !(lastRemoteJSON === null && elements.length === 0)) {
              sceneVersion += 1;
              post("sceneChange", json);
            }
          }
          // --- 视口通道（平移/缩放双端同步；以画面中心点对齐，按屏幕比例换算缩放）---
          if (now >= viewportSuppressUntil && appState) {
            var sx = appState.scrollX || 0;
            var sy = appState.scrollY || 0;
            var z = (appState.zoom && appState.zoom.value) || 1;
            var cx = window.innerWidth / 2 / z - sx;
            var cy = window.innerHeight / 2 / z - sy;
            if (lastSentViewport !== null) {
              var zoomChanged = Math.abs(lastSentViewport.z - z) > 0.002;
              var panChanged =
                Math.abs(lastSentViewport.cx - cx) > 0.5 || Math.abs(lastSentViewport.cy - cy) > 0.5;
              var payload = { cx: cx, cy: cy, vw: window.innerWidth, vh: window.innerHeight, z: z };
              if (zoomChanged) {
                lastSentViewport = { cx: cx, cy: cy, z: z };
                post("viewportZoom", JSON.stringify(payload));
              } else if (panChanged) {
                lastSentViewport = { cx: cx, cy: cy, z: z };
                post("viewportPan", JSON.stringify(payload));
              }
            } else {
              lastSentViewport = { cx: cx, cy: cy, z: z };
            }
          }
        }
      };

      try {
        post("bridgeError", "mounting: lib=" + (typeof ExcalidrawLib) + " react=" + (ExcalidrawLib && typeof ExcalidrawLib.React) + " createRoot=" + (ExcalidrawLib && typeof ExcalidrawLib.createRoot));
        ExcalidrawLib.createRoot(document.getElementById("app")).render(
          ExcalidrawLib.React.createElement(ExcalidrawLib.Excalidraw, props)
        );
      } catch (err) {
        post("bridgeError", "mount failed: " + String(err && err.stack ? err.stack : err));
      }

      // ---- Swift → JS 桥 ----

      // 应用对端场景（参数为一次 JSON 编码的元素数组字符串）
      window.__applyScene = function (encodedJSON) {
        if (!excal) return "not-ready";
        try {
          var wasEmpty = excal.getSceneElements().length === 0;
          var elements = JSON.parse(encodedJSON);
          lastRemoteJSON = encodedJSON;
          suppressUntil = Date.now() + 120;
          excal.updateScene({ elements: elements });
          // 空画布首次收到内容：若内容在视口外则居中定位
          if (wasEmpty && elements.length > 0) {
            try { centerToContent(); } catch (e2) {}
          }
          return "ok";
        } catch (err) {
          return "error:" + err;
        }
      };

      function centerToContent() {
        var els = excal.getSceneElements();
        if (!els.length) return;
        var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        els.forEach(function (e) {
          if (!e.isDeleted) {
            minX = Math.min(minX, e.x);
            minY = Math.min(minY, e.y);
            maxX = Math.max(maxX, e.x + e.width);
            maxY = Math.max(maxY, e.y + e.height);
          }
        });
        if (!isFinite(minX)) return;
        var zoom = 1;
        try {
          var appState = excal.getAppState ? excal.getAppState() : null;
          if (appState && appState.zoom && appState.zoom.value) zoom = appState.zoom.value;
        } catch (e) {}
        var vw = window.innerWidth / zoom;
        var vh = window.innerHeight / zoom;
        excal.updateScene({
          appState: {
            scrollX: vw / 2 - (minX + maxX) / 2,
            scrollY: vh / 2 - (minY + maxY) / 2
          }
        });
      }

      // 取当前场景（返回 JSON 字符串）
      window.__getScene = function () {
        if (!excal) return "[]";
        return JSON.stringify(excal.getSceneElements());
      };

      // 是否已就绪
      window.__isReady = function () {
        return !!excal;
      };

      // ---- 视口同步（Swift → JS）----
      // 语义：以"画面中心点"对齐；接收端缩放 = 发送端缩放 × 屏幕比例，
      // 使 iPad（小屏）完整装下 Mac（大屏）正在看的全部内容。

      function clampZoom(z) {
        return Math.min(8, Math.max(0.1, z));
      }

      // 应用对端平移：保持本端缩放，中心点对齐
      window.__applyViewportPan = function (cx, cy) {
        if (!excal) return "not-ready";
        try {
          var z = currentZoom();
          viewportSuppressUntil = Date.now() + 300;
          lastSentViewport = { cx: cx, cy: cy, z: z };
          excal.updateScene({
            appState: {
              scrollX: window.innerWidth / 2 / z - cx,
              scrollY: window.innerHeight / 2 / z - cy
            }
          });
          return "ok";
        } catch (err) {
          return "error:" + err;
        }
      };

      // 应用对端缩放：按屏幕比例换算（对端画面完整映射到本端）
      window.__applyViewportZoom = function (z, cx, cy, peerVw, peerVh) {
        if (!excal) return "not-ready";
        try {
          var ratio = Math.min(
            window.innerWidth / (peerVw || window.innerWidth),
            window.innerHeight / (peerVh || window.innerHeight)
          );
          var newZ = clampZoom(z * ratio);
          viewportSuppressUntil = Date.now() + 300;
          lastSentViewport = { cx: cx, cy: cy, z: newZ };
          excal.updateScene({
            appState: {
              zoom: { value: newZ },
              scrollX: window.innerWidth / 2 / newZ - cx,
              scrollY: window.innerHeight / 2 / newZ - cy
            }
          });
          return "ok:" + newZ.toFixed(3);
        } catch (err) {
          return "error:" + err;
        }
      };

      function currentZoom() {
        try {
          var as = excal.getAppState ? excal.getAppState() : null;
          return (as && as.zoom && as.zoom.value) || 1;
        } catch (e) {
          return 1;
        }
      }

      // iPad 本地缩放（视口中心为锚，不广播）
      window.__localZoom = function (factor) {
        if (!excal) return "not-ready";
        try {
          var as = excal.getAppState ? excal.getAppState() : null;
          var oldZ = (as && as.zoom && as.zoom.value) || 1;
          var newZ = clampZoom(oldZ * factor);
          var oldSx = (as && as.scrollX) || 0;
          var oldSy = (as && as.scrollY) || 0;
          // 保持视口中心的画布点不动
          var cx = window.innerWidth / 2 / oldZ - oldSx;
          var cy = window.innerHeight / 2 / oldZ - oldSy;
          viewportSuppressUntil = Date.now() + 700;
          lastSentViewport = null; // 本地缩放后暂停广播，直到下一次显式平移/捏合
          excal.updateScene({
            appState: {
              zoom: { value: newZ },
              scrollX: window.innerWidth / 2 / newZ - cx,
              scrollY: window.innerHeight / 2 / newZ - cy
            }
          });
          return "ok:" + newZ.toFixed(3);
        } catch (err) {
          return "error:" + err;
        }
      };

      // 读取当前视口（初始同步用）
      window.__getViewport = function () {
        var z = currentZoom();
        var as = excal && excal.getAppState ? excal.getAppState() : null;
        var sx = (as && as.scrollX) || 0;
        var sy = (as && as.scrollY) || 0;
        return JSON.stringify({
          cx: window.innerWidth / 2 / z - sx,
          cy: window.innerHeight / 2 / z - sy,
          z: z,
          vw: window.innerWidth,
          vh: window.innerHeight
        });
      };
    })();
  </script>
</body>
</html>
